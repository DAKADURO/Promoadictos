<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PromoAdictos Importer</title>
  <style>
    :root {
      --clr-bg: #09090b;
      --clr-card: #18181b;
      --clr-orange: #ff5c00;
      --clr-orange-lt: #ff8e4d;
      --clr-text: #f4f4f5;
      --clr-muted: #a1a1aa;
      --clr-border: rgba(255, 92, 0, 0.15);
      --clr-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 320px;
      background: var(--clr-bg);
      color: var(--clr-text);
      padding: 1.25rem;
      border: 1px solid rgba(255, 92, 0, 0.2);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid rgba(255, 92, 0, 0.1);
      padding-bottom: 0.75rem;
    }

    .logo-container {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--clr-orange), var(--clr-orange-lt));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(255, 92, 0, 0.4);
    }

    .logo-bolt {
      width: 16px;
      height: 16px;
      fill: #fff;
    }

    .brand-name {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(to right, #fff, #ffe5d9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-accent {
      color: var(--clr-orange);
      -webkit-text-fill-color: var(--clr-orange);
    }

    /* Content */
    .content-box {
      background: var(--clr-card);
      border: 1px solid var(--clr-border);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      margin-bottom: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-badge.valid {
      background: rgba(16, 185, 129, 0.1);
      color: var(--clr-green);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .status-badge.invalid {
      background: rgba(161, 161, 170, 0.1);
      color: var(--clr-muted);
      border: 1px solid rgba(161, 161, 170, 0.2);
    }

    .info-text {
      font-size: 0.85rem;
      color: var(--clr-muted);
      line-height: 1.4;
      margin-bottom: 1rem;
    }

    /* Action Button */
    .btn-action {
      width: 100%;
      background: linear-gradient(135deg, var(--clr-orange), var(--clr-orange-lt));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.8rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 92, 0, 0.3);
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 92, 0, 0.45);
    }

    .btn-action:active {
      transform: translateY(0);
    }

    .btn-action:disabled {
      background: var(--clr-card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--clr-muted);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* Footer */
    .footer {
      font-size: 0.7rem;
      text-align: center;
      color: var(--clr-muted);
    }

    .footer a {
      color: var(--clr-orange);
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="header">
    <div class="logo-container">
      <svg class="logo-bolt" viewBox="0 0 24 24">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
      </svg>
    </div>
    <span class="brand-name">PROMO<span class="brand-accent">ADICTOS</span></span>
  </div>

  <div class="content-box">
    <div id="statusBadge" class="status-badge invalid">ℹ️ Detectando...</div>
    <p id="infoText" class="info-text">Navega a un producto de Mercado Libre para importarlo.</p>
    
    <button id="btnPublish" class="btn-action" disabled>
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24" style="margin-top: -2px;">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
      </svg>
      Importar a Admin
    </button>
  </div>

  <div class="footer">
    <span>Desarrollado para ⚡ <strong>PromoAdictos Premium</strong></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
